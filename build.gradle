plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.16'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.talkwithneighbors'
version = '0.0.1-SNAPSHOT'

ext['jackson-bom.version'] = '2.21.5'
ext['logback.version'] = '1.5.35'
// Spring Boot 3.5.16이 관리하는 4.1.135.Final에는 Trivy가 HIGH로 잡는 CVE가 다섯 건 있다.
// netty-codec의 무한 루프(CVE-2026-59901), netty-codec-http의 SPDY 서비스 거부
// 세 건(CVE-2026-55831, CVE-2026-55833, CVE-2026-56745), netty-codec-http2의
// HTTP/2 DATA 프레임 메모리 누수(CVE-2026-56819)가 4.1.136.Final에서 수정됐다.
ext['netty.version'] = '4.1.136.Final'

java {
	sourceCompatibility = '17'
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	constraints {
		// web-push 5.1.1이 2019년의 jose4j 0.7.0과 httpclient 4.5.13을 끌고 온다.
		// 둘 다 공개된 취약점이 있어 컨테이너 스캔을 통과하지 못하므로 최신 패치로 올린다.
		implementation('org.bitbucket.b_c:jose4j:0.9.6') {
			because 'CVE-2023-31582 is fixed in 0.9.3 and later'
		}
		implementation('org.apache.httpcomponents:httpclient:4.5.14')
	}

	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
	implementation 'org.springframework.boot:spring-boot-starter-websocket'
	implementation 'org.springframework.security:spring-security-messaging'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation platform('software.amazon.awssdk:bom:2.48.1')
	implementation 'software.amazon.awssdk:s3'
	implementation 'software.amazon.awssdk:sesv2'
	implementation 'org.springframework.session:spring-session-core'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.session:spring-session-data-redis'
	implementation 'org.springframework.session:spring-session-jdbc'
	implementation 'com.mysql:mysql-connector-j'
	implementation 'com.fasterxml.jackson.datatype:jackson-datatype-hibernate6'
	// VAPID 서명과 페이로드 암호화를 직접 구현하지 않으려고 Web Push 표준 구현을 쓴다.
	// 동기 PushService만 사용하므로 비동기 클라이언트와 CLI 파서는 이미지에서 걷어낸다.
	implementation('nl.martijndwars:web-push:5.1.2') {
		exclude group: 'org.asynchttpclient'
		exclude group: 'com.beust', module: 'jcommander'
	}
	
	runtimeOnly 'com.h2database:h2'
	
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
}

tasks.named('test') {
	useJUnitPlatform {
		excludeTags 'mysql'
	}
	systemProperty 'spring.profiles.active', 'test'
	jvmArgs '-Dfile.encoding=UTF-8'
}

tasks.register('mysqlIntegrationTest', Test) {
	group = 'verification'
	description = 'Runs commit-level persistence tests against MySQL.'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'mysql'
	}
	systemProperty 'spring.profiles.active', 'mysql-it'
	maxParallelForks = 1
	shouldRunAfter tasks.test
	jvmArgs '-Dfile.encoding=UTF-8'
}

compileJava {
    options.encoding = 'UTF-8'
}

compileTestJava {
    options.encoding = 'UTF-8'
}

tasks.withType(JavaCompile) {
}
